name: Verify Android changes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live_kendrick_catalog:
        description: Run the live Kendrick catalog regression
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PIPES_LIVE_DISCOGRAPHY_TEST: ${{ inputs.live_kendrick_catalog && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Run unit tests, build, and lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
