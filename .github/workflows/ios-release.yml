name: Publish iPhone release

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Verify simulator build
        run: >-
          xcodebuild -project ios/Pipes.xcodeproj -scheme Pipes
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Run library and app-flow regression tests
        run: |
          simulator_id=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/Pipes.xcodeproj -scheme Pipes \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build/simulator -resultBundlePath build/PipesTests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-results
          path: build/PipesTests.xcresult
          if-no-files-found: ignore
      - name: Build iPhone app
        run: >-
          xcodebuild -project ios/Pipes.xcodeproj -scheme Pipes
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/device
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO build
      - name: Package sideload IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Pipes.app build/package/Payload/
          cd build/package
          zip -qr ../../Pipes-iOS.ipa Payload
          cd ../..
          shasum -a 256 Pipes-iOS.ipa > Pipes-iOS.ipa.sha256
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/device/Build/Products/Release-iphoneos/Pipes.app/Info.plist)
          tag="ios-v${version}-build${GITHUB_RUN_NUMBER}"
          cp ios/RELEASE_NOTES.md build/release-notes.md
          printf '\nBuilt from %s.\n' "$GITHUB_SHA" >> build/release-notes.md
          gh release create "$tag" Pipes-iOS.ipa Pipes-iOS.ipa.sha256 \
            --target "$GITHUB_SHA" --title "Pipes for iPhone ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file build/release-notes.md --latest=false
