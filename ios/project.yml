name: Pipes
options:
  bundleIdPrefix: com.nazcarbon
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Pipes:
    type: application
    platform: iOS
    sources:
      - path: Pipes
        excludes: [Info.plist, Pipes.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nazcarbon.music.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Pipes/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pipes/Pipes.entitlements
    scheme:
      gatherCoverageData: false
